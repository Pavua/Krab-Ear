name: CI

on:
  push:
    branches: [codex/krab-ear-v2]
  pull_request:
    branches: [codex/krab-ear-v2]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r KrabEar/requirements.txt

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: python -m unittest discover -s KrabEar/tests -p "test_*.py"

      - name: Build Swift agent
        run: cd native/KrabEarAgent && swift build -c release
