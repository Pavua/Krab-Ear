name: CI

on:
  push:
    branches: [codex/krab-ear-v2]
  pull_request:
    branches: [codex/krab-ear-v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - 'native/**'

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('KrabEar/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install ffmpeg (torchcodec dylib dependency)
        # torchcodec ships libtorchcodec_core{4..8}.dylib which dlopen libavutil.{56..60}.dylib.
        # macos-latest doesn't ship ffmpeg by default — install via brew so the test suite
        # can collect modules that transitively import torchcodec without OSError.
        # Wave 49 fix: was the sole remaining Python 3.12 CI fail.
        run: |
          brew install ffmpeg
          brew list --versions ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r KrabEar/requirements.txt
          pip install pytest pytest-cov flake8 pytest-xdist

      - name: Lint (flake8)
        run: |
          # Production code: strict.
          # Tests: relaxed — F401/F541/F841/E203/E303/E306/E401/W391 ok in tests
          # (mock imports, intentionally-unused locals for fixture chaining,
          # f-strings as templated narratives in assert messages).
          flake8 KrabEar/ \
            --max-line-length=150 \
            --extend-ignore=E501 \
            --exclude=KrabEar/.venv,KrabEar/tests/__pycache__,.venv_krab_ear,KrabEar/_legacy_tkinter_archive_2026-02-11 \
            --per-file-ignores='KrabEar/tests/*:F401,F541,F841,E203,E301,E302,E303,E305,E306,E401,E402,W391' \
            --statistics
        continue-on-error: false

      - name: Import check
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: |
          python - << 'PYEOF'
          import sys, importlib, pathlib

          root = pathlib.Path('KrabEar')
          errors = []

          skip = {
              'rest_server',       # requires running Flask app context
          }

          for py in sorted(root.rglob('*.py')):
              parts = py.parts
              if any(p.startswith('.') or p.startswith('_legacy') or p in ('tests', 'scripts') or 'venv' in p for p in parts):
                  continue
              rel = py.relative_to(root).with_suffix('')
              mod = '.'.join(rel.parts)
              if mod in skip or mod.startswith('__'):
                  continue
              try:
                  importlib.import_module(mod)
              except (ImportError, OSError) as e:
                  msg = str(e)
                  heavy = ('mlx', 'pyannote', 'torch', 'sounddevice', 'soundfile',
                           'pyobjc', 'AppKit', 'Foundation', 'Cocoa', 'Vision',
                           'numpy', 'websockets', 'gunicorn', 'flask_limiter',
                           'flask_cors', 'flask_smorest', 'flask_sock', 'marshmallow',
                           'pyperclip', 'requests', 'pydantic',
                           'libav', 'torchcodec', 'cannot open shared', 'Library not loaded', 'libtorchcodec',
                           'pynput', 'jiwer')
                  if any(h in msg for h in heavy):
                      print(f'  SKIP (missing optional dep): {mod} — {e}')
                  else:
                      errors.append(f'{mod}: {e}')
                      print(f'  FAIL: {mod} — {e}')
              except Exception as e:
                  errors.append(f'{mod}: {e}')
                  print(f'  FAIL: {mod} — {e}')

          if errors:
              print(f'\n{len(errors)} import error(s) found:')
              for err in errors:
                  print(f'  - {err}')
              sys.exit(1)
          else:
              print('All modules imported cleanly (or skipped optional deps).')
          PYEOF

      - name: Run Python tests (chunked — bound peak RSS, reap orphan workers)
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        timeout-minutes: 90
        run: |
          # W1737: same chunking as krabear-ci backend-tests — whole-suite OOM-kills
          # the runner mid-run. 4 fresh-process chunks + orphan-worker reaping.
          # W1754: each chunk runs -p no:xdist (sequential) — under -n 2 orphan daemon
          # threads blocked clean xdist worker teardown ("node down") and xdist
          # mis-attributed the dead worker to a random victim test.
          set +e
          mapfile -t files < <(ls KrabEar/tests/test_*.py | sort)
          n=${#files[@]}; nchunks=16; chunk=$(( (n + nchunks - 1) / nchunks )); rc=0; failed=""
          echo "Total test files: $n, chunks: $nchunks, chunk size: $chunk"
          reap() { pkill -9 -f "import sys;ex" 2>/dev/null || true; pkill -9 -f "mlx_subprocess" 2>/dev/null || true; pkill -9 -f "gigaam_worker" 2>/dev/null || true; }
          for i in $(seq 0 $((nchunks - 1))); do
            sub=("${files[@]:$((i*chunk)):$chunk}")
            [ ${#sub[@]} -eq 0 ] && continue
            echo "::group::pytest chunk $((i+1))/$nchunks (${#sub[@]} files)"
            timeout 600 python -m pytest "${sub[@]}" --tb=short -q -p no:xdist -p no:cacheprovider
            crc=$?
            echo "::endgroup::"
            reap
            if [ $crc -ne 0 ]; then
              # W1755: a chunk exit!=0 can be a SIGSEGV (exit 139) from cross-file C-extension
              # contamination (an MLX/GigaAM/torch stub test poisons a LATER file's numpy/torch
              # state -> the whole chunk process dies, masking the culprit and failing 162 innocent
              # files). Re-run this chunk one file per fresh process: contamination-induced crashes
              # pass in isolation (-> green), genuine per-file failures are reported by filename.
              echo "::warning::chunk $((i+1)) exited $crc — re-running per-file to isolate"
              for f in "${sub[@]}"; do
                timeout 150 python -m pytest "$f" --tb=short -q -p no:xdist -p no:cacheprovider > /tmp/pf.log 2>&1
                fcode=$?
                if [ $fcode -ne 0 ]; then
                  echo "::error::isolated FAIL($fcode): $f"; tail -20 /tmp/pf.log
                  rc=$fcode; failed="$failed $f($fcode)"
                fi
                reap
              done
            fi
          done
          echo "Aggregate rc=$rc; failed files:$failed"
          exit $rc

  swift:
    name: Swift agent build
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/KrabEarAgent/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Swift agent
        run: cd native/KrabEarAgent && swift build -c release

  verify-claude-md:
    name: CLAUDE.md drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CLAUDE.md file references
        run: python3 scripts/verify_claude_md.py

  duplicate-defs-guard:
    name: Duplicate definitions guard (W1441)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate function/method definitions
        # Catches cases where a second def silently shadows the first in the same scope,
        # masking shipped bug fixes (root cause: W1425 translator.py, W1438 audio_lang_id.py).
        # @property getter/setter pairs are correctly excluded (valid Python pattern).
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_duplicate_defs.py --fail-on-found

  cherry-pick-regression-guard:
    name: Cherry-pick regression guard (W1538)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check test imports resolve against source modules
        # Detects symbols imported in tests that no longer exist in the source module,
        # which indicates a cherry-pick or rebase silently dropped a fix wave.
        # Root cause of W1525 regression train: 4-of-5 fix waves clobbered by W1497.
        # W1595 (2026-05-29): all 26 regressions fixed — gate is now strict (hard-fail).
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_cherry_pick_regressions.py --fail-on-found

  decorative-wiring-guard:
    name: Decorative wiring audit (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan for unwired late-injections (W1686 follow-up, strict since W1692)
        # Detects service/collaborator instances assigned to attributes in __init__ but
        # never actually called anywhere (decorative-architecture anti-pattern).
        # All 9 confirmed bugs from W1686 were fixed in W1687/W1688/W1690.
        # Strict mode: exits non-zero when any HIGH or MED finding is present.
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_decorative_wiring.py --strict
