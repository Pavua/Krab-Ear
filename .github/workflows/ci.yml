name: CI

on:
  push:
    branches: [codex/krab-ear-v2]
  pull_request:
    branches: [codex/krab-ear-v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - 'native/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/krabear-ci.yml'

  swift:
    name: Swift agent build
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/KrabEarAgent/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Swift agent
        run: cd native/KrabEarAgent && swift build -c release

      # Контракт-тесты проводки (WiringTests / SourceContract): 139 тестов, ~1 с
      # прогона. Ловят класс «написано, но не подключено» — setupErrorBus и
      # setupHealthMonitor месяцами были мёртвыми при 100% зелёных тестах, потому
      # что Swift-тесты в CI не гонялись вовсе. Полный набор (1658) намеренно
      # не здесь: под нагрузкой раннера флейкает — его место в nightly.
      - name: Swift wiring / source-contract tests
        run: |
          cd native/KrabEarAgent
          swift build --build-tests
          swift test --skip-build --filter "WiringTests|SourceContract"

  verify-claude-md:
    name: CLAUDE.md drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CLAUDE.md file references
        run: python3 scripts/verify_claude_md.py

  duplicate-defs-guard:
    name: Duplicate definitions guard (W1441)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate function/method definitions
        # Catches cases where a second def silently shadows the first in the same scope,
        # masking shipped bug fixes (root cause: W1425 translator.py, W1438 audio_lang_id.py).
        # @property getter/setter pairs are correctly excluded (valid Python pattern).
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_duplicate_defs.py --fail-on-found

  cherry-pick-regression-guard:
    name: Cherry-pick regression guard (W1538)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check test imports resolve against source modules
        # Detects symbols imported in tests that no longer exist in the source module,
        # which indicates a cherry-pick or rebase silently dropped a fix wave.
        # Root cause of W1525 regression train: 4-of-5 fix waves clobbered by W1497.
        # W1595 (2026-05-29): all 26 regressions fixed — gate is now strict (hard-fail).
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_cherry_pick_regressions.py --fail-on-found

  decorative-wiring-guard:
    name: Decorative wiring audit (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan for unwired late-injections (W1686 follow-up, strict since W1692)
        # Detects service/collaborator instances assigned to attributes in __init__ but
        # never actually called anywhere (decorative-architecture anti-pattern).
        # All 9 confirmed bugs from W1686 were fixed in W1687/W1688/W1690.
        # Strict mode: exits non-zero when any HIGH or MED finding is present.
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_decorative_wiring.py --strict

  privacy-purge-coverage-guard:
    name: Privacy-purge coverage guard (W1768)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check every persisted PII store is wiped by purge or allowlisted (W1768)
        # Ensures handle_purge_all_data covers every file-backed store that holds user
        # data (history, transcripts, sessions, etc.). Found 28 uncovered gaps in W1768;
        # all fixed before this gate was enforced. Exits non-zero if any gap is found.
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_purge_coverage.py --fail-on-found

  dead-extracted-module-guard:
    name: Dead extracted-module guard (W1768)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check no dead extracted modules or dead cross-file duplicates (W1768)
        # Detects modules that were "extracted" but have no production importer (e.g. the
        # W797 ipc_dispatch / service_logging drift — deleted in W1769 after this guard
        # exposed them). Also catches cross-file duplicate symbols where the inline copy
        # shadows the extracted one. Exits non-zero if any dead module or duplicate found.
        # No user-controlled input is used in this step — no injection risk.
        run: python3 scripts/audit_dead_extracted_modules.py --fail-on-found

  paired-thresholds-guard:
    name: Paired thresholds guard (2026-08-30)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ловит предел, выраженный в одном файле двумя способами: где-то именованной
      # константой, где-то литералом. Ровно так 29.08.2026 упал
      # test_metadata_enricher_W1765 — бюджет подняли в одном классе, соседний
      # остался с прежними 0.3с. Первым шагом гоняем --selftest: гард, тихо
      # переставший классифицировать, отчитывался бы CLEAN вечно.
      # No user-controlled input is used in this step — no injection risk.
      - name: Guard selftest
        run: python3 scripts/audit_paired_thresholds.py --selftest

      - name: Check paired thresholds do not drift
        run: python3 scripts/audit_paired_thresholds.py --fail-on-found

  agent-settings-symmetry-guard:
    name: Agent settings symmetry guard (2026-09-02)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ключ, который AgentSettings разбирает, но не отправляет обратно, панель
      # показать может, а изменить — нет: сохранение идёт только через
      # toPayload(). Так `overlay_follow_cursor` приехал без переключателя и
      # включался лишь сырым IPC-вызовом из терминала. Обратная асимметрия хуже:
      # значение уходит на backend, но эхо ответа его не читает, и контрол
      # «щёлкнул — вернулось обратно». Гард читает Swift-исходник без сборки,
      # поэтому падает за секунды и сразу называет ключ.
      # No user-controlled input is used in this step — no injection risk.
      - name: Guard selftest
        run: python3 scripts/audit_agent_settings_symmetry.py --selftest

      - name: Check AgentSettings reads and writes the same keys
        run: python3 scripts/audit_agent_settings_symmetry.py --fail-on-found

  path-containment-guard:
    name: Path-containment startswith guard (#1674)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check no startswith-based path-containment checks (#1674)
        # Detects filesystem path-containment checks written as string prefix matches
        # (str(resolved).startswith(str(root))), which allow sibling-prefix escapes
        # (/home/user_evil passes a check meant to confine to /home/user).
        # All findings were fixed before this gate was enforced (closes #1674 loop).
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_path_containment.py --fail-on-found

  fake-store-signature-guard:
    name: Fake StateStore signature-drift guard (#1916)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Self-check the classifier before trusting its verdict
        # A guard that silently stops classifying is worse than no guard: it reports
        # CLEAN forever and nobody notices. This runs the known-bad / known-good
        # samples, so a broken classifier fails here instead of going quietly green.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_fake_store_signatures.py --selftest

      - name: Check test fakes still match the StateStore contract (#1916)
        # Tests hand-roll fake StateStores; the real signature moves on (the
        # lock-contention wave 2f27c547 added load_settings(lock_timeout_sec=, nowait=))
        # and the fakes silently diverge. The break is DELAYED -- a diverged fake stays
        # green until the code under test finally reaches the new kwarg, which is how 7
        # files went red at once in #1916 while 22 more sat armed and unnoticed.
        # Criterion: a fake must accept exactly the KEYWORD arguments production calls
        # it with; positional call sites impose nothing (demanding the full signature
        # produced 21 false positives on save_settings).
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_fake_store_signatures.py --fail-on-found

  orphan-panel-controls-guard:
    name: Orphan panel controls guard (2026-09-03)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Контрол панели, объявленный как stored-свойство, но без проводки
      # (target+action / чтение значения из ДОСТИЖИМОГО кода) или без места в
      # иерархии видов — украшение: пикер микрофона заполнялся из
      # get_audio_devices и никуда не отправлял выбор владельца. Первая версия
      # гарда пропускала снятую проводку, потому что чтение значения жило в
      # обработчике без action; теперь тела @objc-методов без единой ссылки
      # #selector вырезаются перед проверкой. Читает Swift-исходник без сборки.
      # No user-controlled input is used in this step — no injection risk.
      - name: Guard selftest
        run: python3 scripts/audit_orphan_panel_controls.py --selftest

      - name: Check every panel control is wired and placed
        run: python3 scripts/audit_orphan_panel_controls.py --fail-on-found

  dead-swift-methods-guard:
    name: Dead Swift methods guard (W6, report-only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Self-check the classifier before trusting its verdict
        # A guard that silently stops classifying reports CLEAN forever and nobody
        # notices -- the same "always-green monitor is blindness" trap the sibling
        # guards self-test against. Known-bad/known-good samples run first.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_dead_swift_methods.py --selftest

      - name: Report dead / test-only Swift methods (W6)
        # The Python side has five dead-code guards; the Swift agent had none, and the
        # class is live there: setupErrorBus + setupHealthMonitor were fully written,
        # never called, and stayed invisible behind 100% green tests for months.
        # REPORT-ONLY on purpose -- the first live run finds 19 dead + 45 test-only
        # methods, and deleting them is a separate owner-approved decision. Flip to
        # --fail-on-found once that backlog is cleared, or the gate is red from day one
        # and gets ignored (which is how a guard dies).
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_dead_swift_methods.py

  dispatch-test-targets-guard:
    name: Dead in-class handler / test-validates-the-hole guard (#47)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check no test validates a dead in-class _handle_X copy (#47/#1675)
        # Detects in-class BackendService._handle_<X> methods that are dead shadows
        # of a live extracted dispatch target, plus tests that validate the dead copy
        # instead of the live extracted handler. 36 found in #1675 (3 masked real
        # security bugs); all deleted + repointed in #1689 before this gate enforced.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_dispatch_test_targets.py --fail-on-found

      - name: IPC/SSE contract-drift guard (#seam)
        # Swift<->Python IPC method-name drift (Swift calls a method absent from the
        # dispatch table) + param-key + SSE dot/underscore drift -- the class that
        # produced 37 silent feature-breakages (2026-06-20 seam-audit campaign).
        # Part A (method-name) is the hard gate; param-key/SSE are report-only.
        # Allowlist: scripts/ipc_drift_allowlist.txt. No user input -- no injection risk.
        run: python3 scripts/audit_ipc_contract_drift.py --fail-on-found
