name: krab-ear-ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - 'native/**'

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('KrabEar/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
            ${{ runner.os }}-pip-

      - name: Install system libraries (libportaudio2, libsndfile1, ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r KrabEar/requirements.txt
          pip install numpy pytest-xdist pytest-cov flake8

      - name: Lint (flake8)
        # W784: mirrors flake8 config from ci.yml -- max-line-length=150, relaxed test ignores
        run: |
          flake8 KrabEar/ \
            --max-line-length=150 \
            --extend-ignore=E501 \
            --exclude=KrabEar/.venv,KrabEar/tests/__pycache__,.venv_krab_ear,KrabEar/_legacy_tkinter_archive_2026-02-11 \
            --per-file-ignores='KrabEar/tests/*:F401,F541,F841,E203,E301,E302,E303,E305,E306,E401,E402,W391' \
            --statistics
        continue-on-error: false

      - name: Run backend/unit tests (chunked -- bound peak RSS, reap orphan workers)
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        timeout-minutes: 120
        run: |
          # W1737: whole-suite (even -n 2) grows RSS monotonically and OOM-kills the
          # ubuntu runner ~54% in (orphan MLX/GigaAM subprocess workers accumulate),
          # so the run never reaches the summary. Run in 4 chunks: each is a fresh
          # process (memory released between), and we reap orphan workers between chunks.
          # W1754: each chunk runs -p no:xdist (sequential) -- under -n 2 orphan daemon
          # threads blocked clean xdist worker teardown ("node down: Not properly
          # terminated") and xdist mis-attributed the dead worker to a random test.
          set +e
          # Один и тот же блок должен оставаться переносимым между Ubuntu и Bash 3.2 на macOS.
          files=()
          for file in KrabEar/tests/test_*.py; do
            [ -f "$file" ] || continue
            files[${#files[@]}]="$file"
          done
          n=${#files[@]}
          if [ "$n" -eq 0 ]; then
            echo "::error::Не найдено ни одного Python test-файла"
            exit 1
          fi
          nchunks=16; chunk=$(( (n + nchunks - 1) / nchunks )); rc=0
          echo "Total test files: $n, chunks: $nchunks, chunk size: $chunk"
          : > /tmp/pf_failed.txt
          reap() { pkill -9 -f "import sys;ex" 2>/dev/null || true; pkill -9 -f "mlx_subprocess" 2>/dev/null || true; pkill -9 -f "gigaam_worker" 2>/dev/null || true; }
          for i in $(seq 0 $((nchunks - 1))); do
            sub=("${files[@]:$((i*chunk)):$chunk}")
            [ ${#sub[@]} -eq 0 ] && continue
            echo "::group::pytest chunk $((i+1))/$nchunks (${#sub[@]} files)"
            timeout 600 python -m pytest "${sub[@]}" --tb=short -q -p no:xdist -p no:cacheprovider
            crc=$?
            echo "::endgroup::"
            reap
            if [ $crc -ne 0 ]; then
              # W1755/W1760: a chunk exit!=0 is usually a SIGSEGV (139) from cross-file C-ext
              # contamination (one test poisons a later file's torch/numpy state -> the whole chunk
              # process dies, masking the culprit). Re-run this chunk one file per FRESH process,
              # 4 in PARALLEL (xargs -P4): contamination crashes pass in isolation (-> green),
              # genuine per-file failures are recorded by filename. Each file is wall-clock bounded
              # (timeout 90) so a hung test cannot stall the job toward the 120-min limit.
              echo "::warning::chunk $((i+1)) exited $crc -- per-file isolate (parallel -P4)"
              printf '%s\n' "${sub[@]}" | xargs -P 4 -I {} bash -c '
                timeout 90 python -m pytest "$1" --tb=line -q -p no:xdist -p no:cacheprovider >/dev/null 2>&1 \
                  || { echo "::error::isolated FAIL($?): $1"; echo "$1" >> /tmp/pf_failed.txt; }
              ' _ {}
              reap
            fi
          done
          if [ -s /tmp/pf_failed.txt ]; then
            rc=1
            echo "=== genuinely-failing files (per-file isolated) ==="; sort -u /tmp/pf_failed.txt
          fi
          echo "Aggregate rc=$rc"
          exit $rc

      - name: Audit orphan imports in service.py
        run: python3 scripts/audit_orphan_imports.py

      - name: Privacy-purge coverage guard (W1768)
        # Ensures handle_purge_all_data covers every file-backed store that holds user
        # data (history, transcripts, sessions, etc.). Found 28 uncovered gaps in W1768;
        # all fixed before this gate was enforced. Exits non-zero if any gap is found.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_purge_coverage.py --fail-on-found

      - name: Dead extracted-module guard (W1768)
        # Detects modules that were "extracted" but have no production importer (e.g. the
        # W797 ipc_dispatch / service_logging drift -- deleted in W1769 after this guard
        # exposed them). Also catches cross-file duplicate symbols where the inline copy
        # shadows the extracted one. Exits non-zero if any dead module or duplicate found.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_dead_extracted_modules.py --fail-on-found
      - name: Path-containment startswith guard (#1674)
        # Detects filesystem path-containment checks written as string prefix matches
        # (str(resolved).startswith(str(root))), which allow sibling-prefix escapes
        # (/home/user_evil passes a check meant to confine to /home/user).
        # All findings were fixed before this gate was enforced (closes #1674 loop).
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_path_containment.py --fail-on-found

      - name: Dead in-class handler / test-validates-the-hole guard (#47)
        # Detects in-class BackendService._handle_<X> methods that are dead shadows of
        # a live extracted dispatch target, plus tests that validate the dead copy
        # instead of the live extracted handler. 36 found in #1675 (3 masked real
        # security bugs: get_topic_timeline DoS + sentiment/keyword privacy leaks);
        # all deleted + repointed in #1689 before this gate was enforced.
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_dispatch_test_targets.py --fail-on-found

      - name: In-memory privacy-purge coverage guard
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        # Curated registry of in-RAM PII collaborators (context_memory, clipboard_history,
        # StateStore search caches, JobTracker, SemanticSearcher) that MUST be cleared by
        # handle_purge_all_data. Enforced since wave-30 (#1717); 0 gaps at enforcement point.
        # Adding a new in-RAM PII collaborator to the registry fails this gate until the
        # matching clear-call is wired — prevents silent purge regressions.
        run: python3 scripts/audit_inmemory_purge_coverage.py --fail-on-found

      - name: Fake StateStore signature-drift guard (#1916)
        # Tests hand-roll fake StateStores; the real signature moves on (the lock-contention
        # wave added load_settings(lock_timeout_sec=, nowait=)) and the fakes silently diverge.
        # The failure is DELAYED -- a diverged fake stays green until the code under test
        # finally reaches the new kwarg, which is how 7 files went red at once in #1916 while
        # 22 more sat armed. Criterion: a fake must accept exactly the KEYWORD arguments
        # production actually calls it with (positional calls impose nothing -- requiring the
        # full signature produced 21 false positives on save_settings).
        # No user-controlled input is used in this step -- no injection risk.
        run: python3 scripts/audit_fake_store_signatures.py --fail-on-found

      - name: IPC/SSE contract-drift guard (#seam)
        # Swift<->Python IPC method-name drift (Swift calls a method absent from the
        # dispatch table) + param-key + SSE dot/underscore drift -- the class that
        # produced 37 silent feature-breakages (2026-06-20 seam-audit campaign).
        # Part A (method-name) is the hard gate; param-key/SSE are report-only.
        run: python3 scripts/audit_ipc_contract_drift.py --fail-on-found


      - name: Compare benchmark history (regression gate)
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: |
          python scripts/compare_benchmarks.py || (echo '::error::Benchmark regression detected' && exit 1)

      - name: Upload benchmark history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: .benchmarks/history.jsonl
          if-no-files-found: ignore
          retention-days: 90


  swift-build:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/KrabEarAgent/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift release build
        run: |
          swift build -c release --package-path native/KrabEarAgent


  verify-claude-md:
    name: CLAUDE.md drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CLAUDE.md file references
        run: python3 scripts/verify_claude_md.py
