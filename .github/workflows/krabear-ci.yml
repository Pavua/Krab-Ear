name: krab-ear-ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('KrabEar/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install system libraries (libportaudio2, libsndfile1, ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r KrabEar/requirements.txt
          pip install numpy pytest-xdist

      - name: Run backend/unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: |
          python -m pytest KrabEar/tests/ -v --tb=short -n auto
      - name: Compare benchmark history (regression gate)
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: |
          python scripts/compare_benchmarks.py || (echo '::error::Benchmark regression detected' && exit 1)

      - name: Upload benchmark history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: .benchmarks/history.jsonl
          if-no-files-found: ignore
          retention-days: 90


  swift-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/KrabEarAgent/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift release build
        run: |
          swift build -c release --package-path native/KrabEarAgent
