name: krab-ear-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r KrabEar/requirements.txt
          pip install numpy

      - name: Run backend/unit tests
        run: |
          python -m unittest discover -s KrabEar/tests -v

  swift-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift release build
        run: |
          swift build -c release --package-path native/KrabEarAgent
