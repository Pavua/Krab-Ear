name: krab-ear-ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - 'native/**'

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('KrabEar/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
            ${{ runner.os }}-pip-

      - name: Install system libraries (libportaudio2, libsndfile1, ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r KrabEar/requirements.txt
          pip install numpy pytest-xdist pytest-cov flake8

      - name: Lint (flake8)
        # W784: mirrors flake8 config from ci.yml — max-line-length=150, relaxed test ignores
        run: |
          flake8 KrabEar/ \
            --max-line-length=150 \
            --extend-ignore=E501 \
            --exclude=KrabEar/.venv,KrabEar/tests/__pycache__,.venv_krab_ear,KrabEar/_legacy_tkinter_archive_2026-02-11 \
            --per-file-ignores='KrabEar/tests/*:F401,F541,F841,E203,E303,E306,E401,E402,W391' \
            --statistics
        continue-on-error: false

      - name: Run backend/unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        timeout-minutes: 90
        run: |
          python -m pytest KrabEar/tests/ \
            -v \
            --tb=short \
            -n 2 \
            -p no:cacheprovider

      - name: Audit orphan imports in service.py
        run: python3 scripts/audit_orphan_imports.py

      - name: Compare benchmark history (regression gate)
        env:
          PYTHONPATH: ${{ github.workspace }}/KrabEar
        run: |
          python scripts/compare_benchmarks.py || (echo '::error::Benchmark regression detected' && exit 1)

      - name: Upload benchmark history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: .benchmarks/history.jsonl
          if-no-files-found: ignore
          retention-days: 90


  swift-build:
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/KrabEarAgent/.build/checkouts
          key: ${{ runner.os }}-spm-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift release build
        run: |
          swift build -c release --package-path native/KrabEarAgent


  verify-claude-md:
    name: CLAUDE.md drift check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CLAUDE.md file references
        run: python3 scripts/verify_claude_md.py
