name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (X.Y.Z, без префикса v)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SPARKLE_TOOLS_VERSION: "2.6.4"
  # SHA-256 официального Sparkle-2.6.4.tar.xz — supply-chain пин: sign_update
  # запускается рядом с EdDSA-приватником, подменённый upstream-ассет = кража ключа.
  SPARKLE_TOOLS_SHA256: "50612a06038abc931f16011d7903b8326a362c1074dabccb718404ce8e585f0b"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout (full — нужны ветка и теги для appcast-пуша)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          # env-индирекция вместо ${{ }} прямо в run: — пользовательский ввод
          # workflow_dispatch не должен интерполироваться в текст скрипта
          # (классическая expression-injection поверхность GitHub Actions).
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::версия не semver X.Y.Z: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: CI-green guard (krab-ear-ci на собираемом коммите)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Дереференс: для АННОТИРОВАННОГО тега GITHUB_SHA = tag-объект, не
          # коммит — rev-parse ^{commit} даёт коммит в обоих случаях (и для
          # workflow_dispatch, где HEAD = tip ветки).
          BUILD_SHA=$(git rev-parse "HEAD^{commit}")
          # appcast-коммиты этого же workflow идут с [skip ci] — krab-ear-ci на
          # них НЕ бежит. Без скипа каждый успешный релиз намертво блокировал бы
          # следующий workflow_dispatch (guard видел бы "missing"). Отматываем
          # такие коммиты к родителю (они меняют только appcast.xml).
          GUARD_SHA="$BUILD_SHA"
          for _ in 1 2 3 4 5; do
            MSG=$(git log -1 --format=%s "$GUARD_SHA")
            # grep -F: "[skip ci]" в case-паттерне был бы character class
            if printf '%s' "$MSG" | grep -qF "release: appcast v" \
               && printf '%s' "$MSG" | grep -qF "[skip ci]"; then
              # Отматываем ТОЛЬКО если коммит правда трогает один appcast.xml —
              # мислейбл-коммит с кодом под этой подписью не должен обойти CI-гейт.
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "$GUARD_SHA")
              [ "$CHANGED" = "appcast.xml" ] || break
              GUARD_SHA=$(git rev-parse "$GUARD_SHA^")
            else
              break
            fi
          done
          # Успешный run ищем среди ВСЕХ ранов коммита (не только последнего):
          # in-progress/cancelled поверх старого success не должны блокировать.
          OK=$(gh run list --commit "$GUARD_SHA" --workflow krabear-ci.yml \
            --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          echo "krab-ear-ci @ $GUARD_SHA (build: $BUILD_SHA): success-ранов $OK"
          [ "${OK:-0}" -ge 1 ] \
            || { echo "::error::krab-ear-ci не зелёный на $GUARD_SHA — релиз запрещён (fail-closed)"; exit 1; }
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci-keychain build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-keychain build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k ci-keychain build.keychain
          # НЕ добавляем серт в system trust store: codesign подписывает
          # untrusted self-signed identity нормально (проверено эмпирически),
          # а `sudo security add-trusted-cert -d` на macOS 15+ раннерах
          # требует GUI-авторизацию — висит до 6h job-таймаута или падает
          # -60005 (runner-images #11893/#12116/#12438). Ультракод-ревью C1.
          rm -f /tmp/cert.p12

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: native/KrabEarAgent/.build
          key: release-spm-${{ runner.os }}-${{ hashFiles('native/KrabEarAgent/Package.resolved') }}

      - name: Build Swift agent
        run: cd native/KrabEarAgent && swift build -c release

      - name: Generate .dSYM (SwiftPM release builds не делают это сами)
        run: |
          BIN="native/KrabEarAgent/.build/release/KrabEarAgent"
          DSYM="$BIN.dSYM"
          rm -rf "$DSYM"
          dsymutil "$BIN" -o "$DSYM"
          dwarfdump --uuid "$DSYM"

      # Кэш только PBS-тарбола интерпретатора (~40 МБ, зафиксирован по SHA256
      # в самом скрипте) — pip install requirements.txt каждый раз заново:
      # requirements.txt может меняться между релизами, кэшировать сами
      # site-packages без инвалидации по его хэшу опаснее, чем несколько
      # лишних минут установки.
      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: build/.runtime_cache
          key: bundled-runtime-pbs-${{ hashFiles('scripts/build_bundled_runtime.command') }}

      - name: Build bundled Python runtime (закрывает T2/T3 онбординга — нет system Python >= 3.12)
        run: |
          df -h . || true
          # 🔴 --skip-download обязателен: без него скрипт безусловно качает
          # тарбол заново (см. build_bundled_runtime.command) — шаг кэша выше
          # был декоративным (ревью 2026-08-09, MEDIUM-2), восстановленный
          # кэш ни разу не читался.
          scripts/build_bundled_runtime.command --output build/vendor --skip-download
          df -h . || true

      - name: Verify bundled runtime is self-contained (#9 — гейт на Homebrew/usr-local утечки)
        run: scripts/verify_bundled_runtime_selfcontained.command build/vendor

      - name: Assemble + sign .app
        run: |
          scripts/assemble_signed_app.sh \
            --output dist \
            --version "${{ steps.ver.outputs.version }}" \
            --identity "Krab Ear CI Release" \
            --vendor-dir build/vendor

      - name: Free disk (vendor уже внутри dist/Krab Ear.app — 2-я копия не нужна)
        run: |
          rm -rf build/vendor
          df -h . || true

      - name: Zip (ditto — сохраняет симлинки внутри framework)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ditto -c -k --keepParent "dist/Krab Ear.app" "dist/Krab-Ear-v$VERSION.zip"
          # basename в .sha256 — иначе `shasum -c` у скачавшего ищет dist/… и падает
          ( cd dist && shasum -a 256 "Krab-Ear-v$VERSION.zip" > "Krab-Ear-v$VERSION.zip.sha256" )

      - name: dSYM → Sentry (best-effort — не блокирует релиз)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          DSYM="native/KrabEarAgent/.build/release/KrabEarAgent.dSYM"
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN не задан (repo secret) — dSYM НЕ загружен, крэши этого релиза не символицируются в Sentry"
            exit 0
          fi
          if [ ! -d "$DSYM" ]; then
            echo "::warning::$DSYM не найден — символикация недоступна для v${{ steps.ver.outputs.version }}"
            exit 0
          fi
          if ! command -v sentry-cli &>/dev/null; then
            brew install --quiet getsentry/tools/sentry-cli
          fi
          if ! sentry-cli --url https://de.sentry.io debug-files upload \
                --org po-zm --project krab-ear-agent "$DSYM"; then
            echo "::warning::sentry-cli upload не прошёл — символикация недоступна для v${{ steps.ver.outputs.version }} (релиз продолжается)"
          fi

      - name: Sparkle sign_update
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          curl -L -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          echo "${SPARKLE_TOOLS_SHA256}  /tmp/sparkle.tar.xz" | shasum -a 256 -c - \
            || { echo "::error::SHA-256 Sparkle-тулзов не совпал с пином — supply-chain стоп"; exit 1; }
          mkdir -p /tmp/sparkle-tools && tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/ed_key
          chmod 600 /tmp/ed_key
          SIGN_OUT=$(/tmp/sparkle-tools/bin/sign_update -f /tmp/ed_key "dist/Krab-Ear-v$VERSION.zip")
          rm -f /tmp/ed_key
          echo "sign_update: $SIGN_OUT"
          ED_SIG=$(echo "$SIGN_OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SIGN_OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          [ -n "$ED_SIG" ] && [ -n "$LENGTH" ] \
            || { echo "::error::не распарсили вывод sign_update"; exit 1; }
          echo "ed_sig=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"

      - name: Update appcast.xml (монотонность версии проверяет сам скрипт)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git checkout codex/krab-ear-v2
          python3 scripts/generate_appcast_item.py \
            --appcast appcast.xml \
            --version "$VERSION" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Krab-Ear-v$VERSION.zip" \
            --ed-signature "${{ steps.sparkle.outputs.ed_sig }}" \
            --length "${{ steps.sparkle.outputs.length }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # --target: тег создаётся на ПРОВЕРЕННОМ guard'ом коммите, а не на
          # tip'е ветки в момент API-вызова (гонка с параллельным пушем).
          # Идемпотентность: если релиз уже существует (ре-ран после падения
          # НА ПОСЛЕДУЮЩЕМ шаге appcast-коммита), не падаем — доливаем ассеты
          # при их отсутствии и идём дальше чинить appcast (ревью C3/C8).
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Ре-ран ВСЕГДА перезаливает ассеты: zip пересобран (codesign-метки
            # времени меняют байты), appcast-шаг уже подписал ИМЕННО новый zip —
            # старый ассет со свежей подписью = EdDSA-мисматч у клиентов.
            echo "release v$VERSION уже существует — ре-ран; перезаливаю ассеты под свежую подпись"
            gh release upload "v$VERSION" \
              "dist/Krab-Ear-v$VERSION.zip" \
              "dist/Krab-Ear-v$VERSION.zip.sha256" --clobber
          else
            gh release create "v$VERSION" \
              "dist/Krab-Ear-v$VERSION.zip" \
              "dist/Krab-Ear-v$VERSION.zip.sha256" \
              --title "Krab Ear v$VERSION" \
              --target "${{ steps.guard.outputs.build_sha }}" \
              --generate-notes
          fi

      - name: Commit appcast (после успешного релиза; [skip ci])
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release: appcast v$VERSION [skip ci]"
          # Retry: гонка с параллельным пушем в ветку не должна стрэндить
          # опубликованный релиз без appcast-записи (ревью C8). При rebase
          # только-appcast коммит конфликтовать может лишь с чужим appcast-
          # коммитом — маловероятно (concurrency: group release).
          for attempt in 1 2 3; do
            git pull --rebase origin codex/krab-ear-v2 || { git rebase --abort || true; sleep 5; continue; }
            git push origin codex/krab-ear-v2 && exit 0
            sleep 5
          done
          echo "::error::не удалось запушить appcast после 3 попыток — релиз опубликован, appcast НЕ обновлён; повторите ре-ран workflow"
          exit 1
