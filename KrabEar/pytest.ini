[pytest]
# Ограничиваем накопление pytest temp-файлов в /private/var/folders/
# Без этой настройки pytest хранит последние 3 сессии со ВСЕМИ temp-данными
# (аудиофайлы, wav, m4a) и папка разрастается до 40+ GB
# Подробнее: https://docs.pytest.org/en/stable/how-to/tmp_path.html
tmp_path_retention_count = 1
tmp_path_retention_policy = failed

# Показывать короткий traceback, не загрязнять лог
addopts = --tb=short -q

# W957 defense-in-depth: режем hung-тесты по таймауту. Требует pytest-timeout;
# без плагина молча игнорируется (это и был корень W957) — ОСНОВНАЯ защита это
# conftest network-guard (блок не-loopback connect, плагин не нужен).
timeout = 30
timeout_method = thread

# Папка с тестами
testpaths = tests

# Маркеры
markers =
    slow: тесты, которые работают долго (>5s). Запуск: pytest -m slow
    live: тесты, которым разрешён реальный (не-loopback) сетевой вызов (W957)
    acceptance: acceptance-тесты, тот же network-escape, что live
    llm_network_live: тест реально проверяет LLMRewriter.ping/warmup_probe/
        summarize через self._session (не декоративный мок) — исключён из
        conftest._block_real_lm_studio_calls автопатча
